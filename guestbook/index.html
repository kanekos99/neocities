<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" type="text/css" href="../home/styles/main.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../common/styles/sidemenu.css"
    />
    <link rel="stylesheet" type="text/css" href="styles/guestbook.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.21/jquery.csv.min.js"
      integrity="sha512-Y8iWYJDo6HiTo5xtml1g4QqHtl/PO1w+dmUpQfQSOTqKNsMhExfyPN2ncNAe9JuJUSKzwK/b6oaNPop4MXzkwg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaneko's Guestbook</title>
    <link rel="icon" type="image/x-icon" href="assets/home-v2.png" />
  </head>

  <body>
    <div class="main-body" id="main-body">
      <div class="menu-icon-container">
        <i class="fa fa-bars menu-icon shadow" onClick="toggleSideMenu();"></i>
      </div>

      <div class="mt-4">
        <!-- Guestbook  -->
        <div class="row justify-content-center guestbook-row">
          <div class="guestbook-container">
            <div class="row justify-content-center align-items-center">
              <div
                id="form-container"
                class="row justify-content-center p-3"
              >
                <div>
                  <img
                    src="assets/guestbook-img.png"
                    class="guestbook-image mb-3"
                  />
                </div>
                <form
                  id="c_form"
                  onsubmit="
                    c_submitButton.disabled = true;
                    v_submitted = true;
                  "
                  action="https://docs.google.com/forms/d/e/1FAIpQLSelPNw6ngJrYdDLv6PiiQO9y9sAJvlVkkEEWTaCoGY8-D1fnA/formResponse"
                  method="post"
                  target="c_hiddenIframe"
                  autocomplete="off"
                >
                  <div class="row justify-content-center mb-2">
                    <div class="input-container">
                      <p class="input-label"><b>name</b></p>
                      <input
                        type="text"
                        placeholder="Your Name"
                        id="entry.679618476"
                        name="entry.679618476"
                        required
                      />
                    </div>
                  </div>
                  <div class="row justify-content-center mb-3">
                    <div class="input-container">
                      <p class="input-label"><b>website</b></p>
                      <input
                        type="text"
                        placeholder="Website (optional)"
                        id="entry.1966533572"
                        name="entry.1966533572"
                      />
                    </div>
                  </div>
                  <div class="row justify-content-center mb-3">
                    <div class="input-container">
                      <textarea
                        id="entry.674350405"
                        name="entry.674350405"
                        placeholder="Leave your message here..."
                        rows="4"
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          resize: vertical;
                        "
                        required
                      ></textarea>
                    </div>
                  </div>

                  <hr class="dotted-divider-2" />

                  <div id="submitButtonContainer">
                    <span id="replyTxtContainer"></span>
                    <button
                      type="submit"
                      name="c_submitButton"
                      id="c_submitButton"
                    >
                      submit
                    </button>
                  </div>
                </form>
              </div>
              <div class="messages-container">
                <div class="messages-box-outer">
                  <div class="messages-box-inner">
                    <h3 id="messages-header">
                      Messages
                      <i class="fa fa-envelope ms-1" aria-hidden="true"></i>
                    </h3>
                    <hr class="dotted-divider-2" />
                    <div id="c_container">
                      <p class="loading-text">Loading comments...</p>
                    </div>
                  </div>
                  <div class="row justify-content-center">
                    <div id="made-with">
                      <small
                        >Made with
                        <b
                          ><a
                            href="https://virtualobserver.moe/ayano/comment-widget"
                            target="_blank"
                            >Ayano's Comment Widget</a
                          ></b
                        >
                      </small>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="c_widget"></div>
        <script src="scripts/comment-widget.js"></script>
      </div>
    </div>

    <script src="../common/scripts/sidemenu.js"></script>
  </body>
</html>
